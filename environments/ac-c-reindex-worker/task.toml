schema_version = "1.4"

[task]
name = "rle/ac-c-reindex-worker"
version = "1.0.0"
description = "Make a supervised, budgeted search-reindex worker resumable (checkpointing + graceful SIGTERM) and finish the index."

[metadata]
difficulty = "medium"
category = "autonomy-and-control"
tags = ["AC.C", "control", "signals", "supervisor", "checkpoint-resume", "python"]

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
network_mode = "no-network"
